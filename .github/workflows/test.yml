name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-test:
    name: node --test (tests/*.test.{js,mjs})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run test:js
