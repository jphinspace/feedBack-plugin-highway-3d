name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  node-test:
    name: Node 24 test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:js
