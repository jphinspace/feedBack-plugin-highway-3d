name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eslint:
    name: ESLint (Airbnb JavaScript style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint
