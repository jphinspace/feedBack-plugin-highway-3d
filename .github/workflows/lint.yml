name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eslint:
    name: Node 24 ESLint (Airbnb JavaScript style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint
